<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <title>Queen of the Krown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="crown" data-icon="crown"></span>
        <span class="brand-name" id="brandName">Queen of the Krown</span>
      </a>
      <div class="sync" id="syncStatus" aria-live="polite"></div>
      <nav class="nav" id="nav"></nav>
      <button class="btn gold block side-pay" data-act="logPayment"><span data-icon="plus"></span>Log Payment</button>
    </aside>
    <div class="scrim" data-act="closeMenu"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-act="openMenu" aria-label="Open menu"><span data-icon="menu"></span></button>
        <h1 class="page-title" id="pageTitle"></h1>
        <div class="top-actions">
          <button class="mic-top" data-act="assistant" aria-label="Talk to your assistant"><span data-icon="mic"></span><span class="hide-sm">Ask</span></button>
          <button class="btn ghost hide-sm" data-act="addExpense"><span data-icon="receipt"></span>Add Expense</button>
          <button class="btn dark hide-sm" data-act="logPayment"><span data-icon="plus"></span>Log Payment</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" aria-label="Main">
      <a href="#/dashboard" data-page="dashboard"><span data-icon="home"></span>Home</a>
      <a href="#/appointments" data-page="appointments"><span data-icon="calendar"></span>Appointments</a>
      <button class="pay-fab" data-act="logPayment" aria-label="Log payment"><span data-icon="plus"></span><small>Payment</small></button>
      <a href="#/expenses" data-page="expenses"><span data-icon="receipt"></span>Expenses</a>
      <button data-act="openMenu"><span data-icon="menu"></span>More</button>
    </nav>
  </div>

  <div id="auth" class="auth" hidden></div>
  <div id="portal" hidden></div>
  <div id="lock" class="lock" hidden></div>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- bump ?v= on every release so phones never mix old and new files -->
  <script src="logic.js?v=8"></script>
  <script src="app.js?v=8"></script>
  <script src="cloud.js?v=8"></script>
  <script>
    // GitHub Pages lets browsers reuse an old copy for 10 minutes: if a newer release is out, open it.
    fetch(location.pathname, { cache: 'no-store' }).then(r => r.text()).then(t => {
      const live = (t.match(/app\.js\?v=(\d+)/) || [])[1], mine = document.querySelector('script[src*="app.js"]').src.match(/v=(\d+)/)[1];
      if (live && +live > +mine) location.replace(location.pathname + '?v=' + live + location.hash);
    }).catch(() => {});
  </script>
</body>
</html>
